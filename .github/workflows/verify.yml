name: Verify proof artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record environment
        run: |
          uname -a
          gcc --version
          python3 --version
          sha256sum --version
      - name: Verify and regenerate certificates
        run: bash scripts/verify.sh --regenerate

      - name: Build paper PDF
        if: github.event_name != 'pull_request'
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: paper
          root_file: siege4x4.tex
          args: -interaction=nonstopmode -halt-on-error

      - name: Publish paper PDF
        if: github.event_name != 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          test -f paper/siege4x4.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/siege4x4.pdf
          git diff --cached --quiet || git commit -m "Add compiled paper PDF"
          git push
